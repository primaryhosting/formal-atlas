  title: The Factor and Remainder Theorems
  wiedijk_number: 89
  informal_statement: For a polynomial f over a commutative ring and an element a,
    the remainder upon dividing f by x − a is the constant f(a); in particular, x
    − a divides f if and only if a is a root of f.

- slug: wiedijk-096-principle-of-inclusion-exclusion
  title: Principle of Inclusion/Exclusion
  wiedijk_number: 96
  informal_statement: For finite sets A₁, …, Aₙ, the cardinality of their union is
    |A₁ ∪ ⋯ ∪ Aₙ| = ∑_{∅ ≠ S ⊆ {1,…,n}} (−1)^{|S|+1} |⋂_{i∈S} A_i|; that is, one alternately
    adds the sizes of all intersections of odd numbers of the sets and subtracts those
    of even numbers.
  msc_primary: null

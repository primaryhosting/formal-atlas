- slug: wiedijk-092-pick-s-theorem
  title: Pick’s Theorem
  wiedijk_number: 92
  informal_statement: The area of a simple polygon whose vertices are lattice points
    equals I + B/2 − 1, where I is the number of lattice points in the polygon's interior
    and B is the number of lattice points on its boundary.

  title: Liouville’s Theorem and the Construction of Transcendental Numbers
  wiedijk_number: 18
  informal_statement: If α is an irrational algebraic number of degree n, then there
    is a constant c > 0 such that |α − p/q| > c/qⁿ for all integers p and q with q

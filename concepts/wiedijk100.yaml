- slug: wiedijk-087-desargues-s-theorem
  title: Desargues’s Theorem
  wiedijk_number: 87
  informal_statement: 'In a projective plane over a field (or any projective space
    of dimension at least three), two triangles are in perspective from a point if
    and only if they are in perspective from a line: if the three lines joining corresponding
    vertices of triangles ABC and A''B''C'' are concurrent, then the three points
    of intersection of corresponding sides AB·A''B'', BC·B''C'', CA·C''A'' are collinear,
    and conversely.'
  msc_primary: null
  status: open
  alignments: []
